<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Application Design | Mariz De Las Alas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portfolio.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="site-orbs"></div>

  <div id="site-nav"></div>

  <main>

    <section class="portfolio-hero">
      <div class="container">
        <a class="back-link" href="index.html#work">
          <i data-lucide="arrow-left"></i>
          Back to work
        </a>
        <div class="portfolio-hero-inner reveal">
          <div class="portfolio-meta">
            <span class="meta">Gallery · Mobile Design</span>
          </div>
          <h1>Mobile Application Design</h1>
          <p class="portfolio-lead">A collection of mobile interface designs focused on clear flows, clean visual hierarchy, and intuitive app experiences across different screen states.</p>
          <div class="portfolio-tags">
            <span>Mobile UI</span>
            <span>Wireframes</span>
            <span>Prototype</span>
            <span>User Flow</span>
          </div>
        </div>
      </div>
    </section>

    <section class="gallery-section">
      <div class="container">
        <div class="gallery-grid mobile-gallery-grid reveal">
          <button class="gallery-item mobile-gallery-item image-lightbox-trigger" type="button" data-full-image="img-portfolio/mobile/mobile-1.webp" data-image-alt="Mobile application design screen 1">
            <img src="img-portfolio/mobile/mobile-1.webp" alt="Mobile application design screen 1" loading="lazy">
          </button>
          <button class="gallery-item mobile-gallery-item image-lightbox-trigger" type="button" data-full-image="img-portfolio/mobile/mobile-2.webp" data-image-alt="Mobile application design screen 2">
            <img src="img-portfolio/mobile/mobile-2.webp" alt="Mobile application design screen 2" loading="lazy">
          </button>
          <button class="gallery-item mobile-gallery-item image-lightbox-trigger" type="button" data-full-image="img-portfolio/mobile/mobile-3.webp" data-image-alt="Mobile application design screen 3">
            <img src="img-portfolio/mobile/mobile-3.webp" alt="Mobile application design screen 3" loading="lazy">
          </button>
        </div>
      </div>
    </section>

    <section class="portfolio-nav">
      <div class="container">
        <div class="portfolio-nav-inner reveal">
          <a href="index.html#work" class="button secondary">
            <i data-lucide="grid-2x2"></i>
            All work
          </a>
        </div>
      </div>
    </section>

  </main>

  <div class="image-lightbox" aria-hidden="true">
    <button class="image-lightbox-close" type="button" aria-label="Close image"><i data-lucide="x"></i></button>
    <img src="" alt="">
  </div>

  <div id="site-footer"></div>

  <script src="components.js"></script>
</body>
</html>
